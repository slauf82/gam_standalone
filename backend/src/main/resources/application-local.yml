spring:
  datasource:
    url: ${GAM_DB_URL:jdbc:mariadb://localhost:3306/kopfzentruminventardb}
    username: ${GAM_DB_USER:root}
    password: ${GAM_DB_PASSWORD:}
logging:
  level:
    de.kopfzentrum.gam: DEBUG

app:
  security:
    jwt-secret: ${GAM_JWT_SECRET:GAM2-Test-Secret-2026-Bitte-Spaeter-Ersetzen-123456789}
    jwt-minutes: ${GAM_JWT_MINUTES:480}
  legacy-login:
    allow-sha256-password: true
    allow-totp-only: false
    allow-totp-login: true
    require-totp-when-secret-exists: false
  invoice:
    lbd:
      file: ${GAM_LBD_FILE:}
      search-folders: ${GAM_LBD_SEARCH_FOLDERS:./config,./daten/rechnung,.}
      charset: ${GAM_LBD_CHARSET:UTF-8}

zugferd:
  enabled: true
