spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.groovy.template.GroovyTemplateAutoConfiguration
  datasource:
    url: ${GAM_DB_URL:jdbc:mariadb://localhost:3306/kopfzentruminventardb}
    username: ${GAM_DB_USER:root}
    password: ${GAM_DB_PASSWORD:}
  mail:
    host: ${SPRING_MAIL_HOST:mail.gmx.net}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:neu.gam@gmx.de}
    password: "${SPRING_MAIL_PASSWORD:GAM.neu#v-20}"
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLE:true}
logging:
  level:
    de.kopfzentrum.gam: DEBUG
    com.openhtmltopdf.general: ERROR

app:
  security:
    jwt-secret: ${GAM_JWT_SECRET:GAM2-Test-Secret-2026-Bitte-Spaeter-Ersetzen-123456789}
    jwt-minutes: ${GAM_JWT_MINUTES:480}
  legacy-login:
    allow-sha256-password: true
    allow-totp-only: true
    allow-totp-login: true
    require-totp-when-secret-exists: false
  invoice:
    lbd:
      file: ${GAM_LBD_FILE:beispiel.lbd}
      search-folders: ${GAM_LBD_SEARCH_FOLDERS:C:/GAM2/config,./config,../config,./config/demo-lbd,../config/demo-lbd,./daten/rechnung,../daten/rechnung,.}
      charset: ${GAM_LBD_CHARSET:windows-1252}
    pdf:
      archive-enabled: ${GAM_PDF_ARCHIVE_ENABLED:true}
      archive-folder: ${GAM_PDF_ARCHIVE_FOLDER:./daten/rechnung/archiv}
      hotfolder-enabled: ${GAM_PDF_HOTFOLDER_ENABLED:false}
      hotfolder-folder: ${GAM_PDF_HOTFOLDER_FOLDER:./daten/rechnung/hotfolder}
      hotfolder-filename-mode: ${GAM_PDF_HOTFOLDER_FILENAME_MODE:patient-number}

  translation:
    libretranslate:
      enabled: ${GAM_LIBRETRANSLATE_ENABLED:true}
      # Zuerst lokaler Server, falls vorhanden. Dadurch bleibt GAM lokal/offline-faehig.
      url: ${GAM_LIBRETRANSLATE_URL:http://localhost:5000/translate}
      # Schlanker Online-Fallback im Stil der alten libretranslate-java-Nutzung.
      fallback-url: ${GAM_LIBRETRANSLATE_FALLBACK_URL:https://translate.fedilab.app/translate}
      api-key: ${GAM_LIBRETRANSLATE_API_KEY:}
      java-client-enabled: ${GAM_LIBRETRANSLATE_JAVA_CLIENT_ENABLED:true}
      diagnostics: ${GAM_LIBRETRANSLATE_DIAGNOSTICS:false}

  tts:
    enabled: ${GAM_TTS_ENABLED:true}
    engine: ${GAM_TTS_ENGINE:piper}
    browser-fallback: ${GAM_TTS_BROWSER_FALLBACK:true}
    piper:
      home: ${GAM_PIPER_HOME:./tts/piper}
      executable: ${GAM_PIPER_EXECUTABLE:./tts/piper/piper.exe}
      voices-dir: ${GAM_PIPER_VOICES_DIR:./tts/piper/voices}
      auto-download: ${GAM_PIPER_AUTO_DOWNLOAD:true}
    fallback:
      de: ${GAM_TTS_FALLBACK_DE:de-DE,de,en-US,en}
      en: ${GAM_TTS_FALLBACK_EN:en-US,en-GB,en,de-DE,de}
      fr: ${GAM_TTS_FALLBACK_FR:fr-FR,fr,en-US,en,de-DE,de}
      uk: ${GAM_TTS_FALLBACK_UK:uk-UA,uk,ru-RU,ru,en-US,en,de-DE,de}
      it: ${GAM_TTS_FALLBACK_IT:it-IT,it,en-US,en,de-DE,de}
      sv: ${GAM_TTS_FALLBACK_SV:sv-SE,sv,en-US,en-GB,en,de-DE,de}
      tr: ${GAM_TTS_FALLBACK_TR:tr-TR,tr,en-US,en-GB,en,de-DE,de}
      ru: ${GAM_TTS_FALLBACK_RU:ru-RU,ru,en-US,en-GB,en,de-DE,de}
      es: ${GAM_TTS_FALLBACK_ES:es-ES,es,en-US,en-GB,en,de-DE,de}
      pt: ${GAM_TTS_FALLBACK_PT:pt-PT,pt-BR,pt,en-US,en-GB,en,de-DE,de}
      nl: ${GAM_TTS_FALLBACK_NL:nl-NL,nl,en-US,en-GB,en,de-DE,de}
      pl: ${GAM_TTS_FALLBACK_PL:pl-PL,pl,en-US,en-GB,en,de-DE,de}
      cs: ${GAM_TTS_FALLBACK_CS:cs-CZ,cs,en-US,en-GB,en,de-DE,de}


zugferd:
  enabled: true

# Schritt 38g6: direkter Bestell-E-Mailversand.
# Standardmäßig deaktiviert, damit GAM ohne Mailkonto weiter startet.
# Aktivierung z.B. per Umgebungsvariablen:
#   GAM_ORDERS_MAIL_ENABLED=true
#   SPRING_MAIL_HOST=smtp.example.de
#   SPRING_MAIL_PORT=587
#   SPRING_MAIL_USERNAME=<mailkonto>
#   SPRING_MAIL_PASSWORD=<app-passwort>
#   GAM_ORDERS_MAIL_FROM=<mailkonto>
gam:
  orders:
    mail:
      enabled: ${GAM_ORDERS_MAIL_ENABLED:true}
      from: ${GAM_ORDERS_MAIL_FROM:${SPRING_MAIL_USERNAME:neu.gam@gmx.de}}
      from-name: ${GAM_ORDERS_MAIL_FROM_NAME:GAM 2.0}
      default-recipient: ${GAM_ORDERS_MAIL_DEFAULT_RECIPIENT:${SPRING_MAIL_USERNAME:neu.gam@gmx.de}}
      default-subject: ${GAM_ORDERS_MAIL_DEFAULT_SUBJECT:Materialbestellung GAM}
      default-text: ${GAM_ORDERS_MAIL_DEFAULT_TEXT:Hallo,\n\nbitte liefern Sie die folgenden Materialien.\n\nVielen Dank.}
  login:
    news:
      enabled: ${GAM_LOGIN_NEWS_ENABLED:false}
      title: ${GAM_LOGIN_NEWS_TITLE:Wichtiger Hinweis}
      text: ${GAM_LOGIN_NEWS_TEXT:}
      severity: ${GAM_LOGIN_NEWS_SEVERITY:info}

# Schritt 38g7: Kommunikationsassistent.
# GMX-Standardwerte sind bewusst vorbelegt; Benutzername/Passwort bleiben lokal/secret.
# Beispiel:
#   SPRING_MAIL_HOST=mail.gmx.net
#   SPRING_MAIL_PORT=587
#   SPRING_MAIL_USERNAME=<vorbereitete-gmx-adresse>
#   SPRING_MAIL_PASSWORD=<app-passwort>
#   SPRING_MAIL_STARTTLS_ENABLE=true
#   SPRING_MAIL_SMTP_AUTH=true
